stage: 3
name: "stage3_concept_grpo"
warm_start_policy: "checkpoints/sft_concept_adapter"
foundation_backbone: "deepseek-ai/DeepSeek-R1-Distill-Qwen-1.5B"
dataset_path: "data/stage3_unified_curriculum.jsonl"
dataset_sha256: "29b07365b5dd2d687c2b683a090db94c9e099179f5a37084d3f5789ac8b7e4ae"

lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"

grpo:
  steps: 250
  num_generations: 8
  max_prompt_length: 256
  max_completion_length: 128
  learning_rate: 1.0e-5
  beta: 0.04
  temperature: 0.7
  gradient_accumulation_steps: 8
  bf16: true

rewards:
  accuracy_weight: 1.0
  anti_guessing_penalty: -0.80     # Harsh penalty on blind 1-token guesses for multi-step math
  concept_alignment_bonus: 0.35    # Bonus for declaring valid domain invariants in <reg:plan>
  clean_closure_reward: 0.20
